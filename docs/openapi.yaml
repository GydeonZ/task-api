openapi: 3.0.3
info:
  title: Task API
  description: REST API for task management with boards, lists, and tasks
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local server
paths:
  /login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: password123
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: invalid credentials

  /register:
    post:
      summary: Register new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: janesmith
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  example: password123
              required:
                - username
                - email
                - password
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User registered successfully

  /boards:
    post:
      summary: Create board
      security:
        - BearerAuth: []
      tags:
        - Boards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: My Board
              required:
                - title
      responses:
        '201':
          description: Board created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Board created successfully
                  data:
                    $ref: '#/components/schemas/Board'
    get:
      summary: Get all user boards
      security:
        - BearerAuth: []
      tags:
        - Boards
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Board'

  /boards/{id}:
    get:
      summary: Get board by ID
      security:
        - BearerAuth: []
      tags:
        - Boards
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Board'
    put:
      summary: Update board
      security:
        - BearerAuth: []
      tags:
        - Boards
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Updated Title
              required:
                - title
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Board updated successfully
    delete:
      summary: Delete board
      security:
        - BearerAuth: []
      tags:
        - Boards
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Board deleted successfully

  /boards/{boardId}/lists:
    post:
      summary: Create list under a board
      security:
        - BearerAuth: []
      tags:
        - Lists
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: To Do
              required:
                - name
      responses:
        '201':
          description: List created
    get:
      summary: Get lists under a board
      security:
        - BearerAuth: []
      tags:
        - Lists
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success

  /lists/{id}:
    get:
      summary: Get list details
      security:
        - BearerAuth: []
      tags:
        - Lists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
    put:
      summary: Update list
      security:
        - BearerAuth: []
      tags:
        - Lists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: In Progress
              required:
                - name
      responses:
        '200':
          description: Success
    delete:
      summary: Delete list
      security:
        - BearerAuth: []
      tags:
        - Lists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success

  /lists/{listId}/tasks:
    post:
      summary: Create task under a list
      security:
        - BearerAuth: []
      tags:
        - Tasks
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Finish report
                description:
                  type: string
                  example: Compile Q2 database report
              required:
                - title
      responses:
        '201':
          description: Task created
    get:
      summary: Get tasks under a list
      security:
        - BearerAuth: []
      tags:
        - Tasks
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success

  /tasks/{id}:
    get:
      summary: Get task details
      security:
        - BearerAuth: []
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
    put:
      summary: Update task
      security:
        - BearerAuth: []
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Updated task title
                description:
                  type: string
                  example: Updated task description
                is_completed:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Success
    delete:
      summary: Delete task
      security:
        - BearerAuth: []
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success

  /tasks/{id}/complete:
    patch:
      summary: Complete task
      security:
        - BearerAuth: []
      tags:
        - Tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Board:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        title:
          type: string
          example: My Board
        slug:
          type: string
          example: my-board
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
