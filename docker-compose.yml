services:
  postgres:
    image: postgres:16-alpine
    container_name: task_api_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - task_network

  task_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_api_server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: task_management
      DB_SSL_MODE: disable
      SERVER_PORT: 3000
      APP_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task_network

volumes:
  postgres_data:

networks:
  task_network:
    driver: bridge
